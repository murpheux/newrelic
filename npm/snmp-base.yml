devices: {}
trap:
  listen: 0.0.0.0:1620
  community: public
  version: ''
  transport: ''
  v3_config: null
discovery:
  cidrs:
    - 10.10.2.0/24
  ignore_list: []
  debug: false
  ports:
    - 161
  default_communities:
    - public
  use_snmp_v1: false
  default_v3: null
  add_devices: true
  add_mibs: true
  threads: 4
  replace_devices: true
  check_all_ips: true
  kentik: null
global:
  poll_time_sec: 1800
  drop_if_outside_poll: false
  mib_profile_dir: /etc/ktranslate/profiles
  mibs_db: /etc/ktranslate/mibs.db
  mibs_enabled:
    - IF-MIB
    - IP-MIB
    - OSPF-MIB
    - TCP-MIB
    - UDP-MIB
  timeout_ms: 3000
  retries: 0
  global_v3: null
  response_time: false
  user_tags: {}
  match_attributes: {}
  providers: {}
  jitter_time_sec: 0
  fast_poll: false
  watch_profile_changes: false
