// fetchOHIs

const additionalConditions = ` WHERE environment = '${environment}' LIMIT MAX `;

actor {
        account(id: 2564166) {
          queues: nrql(query: "SELECT uniques(\`Queue Name\`) AS queues FROM EMSQueue FACET \`EMS Server\` ${additionalConditions}") {
            results
          }
          topics: nrql(query: "SELECT uniques(Topic) AS topics FROM EMSTopic FACET \`EMS Server\` ${additionalConditions}") {
            results
          }
          postgres: nrql(query: "SELECT uniques(displayName) AS databases FROM PostgresqlDatabaseSample FACET hostname ${additionalConditions}") {
            results
          }
          cassandra: nrql(query: "SELECT uniques(displayName) as databases FROM CassandraSample FACET fullHostname ${additionalConditions}") {
            results
          }
          apache: nrql(query: "SELECT uniques(displayName) AS servers FROM ApacheSample FACET hostname  ${additionalConditions}") {
            results
          }
          alerts: nrql(query: "SELECT latest(open_violations_count_critical) AS openCritical, latest(open_violations_count_warning) AS openWarning FROM TibcoAlertsTargets FACET targetsname SINCE 1 day ago LIMIT MAX") {
            results
          }
          cassandraStatuses: nrql(query: "SELECT latest(status) AS status FROM CassandraNodeToolSample FACET displayName  ${additionalConditions}") {
            results
          }
          queuesMessages: nrql(query: "SELECT latest(\`Total Pending Count\`) AS queuesmp from EMSQueueTotals  facet \`EMS Server\`  ${additionalConditions}") {
            results
          }
          topicsMessages: nrql(query: "SELECT latest(\`Total Pending Count\`) AS topicsmp from EMSTopicTotals  facet \`EMS Server\`  ${additionalConditions}") {
            results
          }
        }
      }