integrations:
  - name: nri-flex
    timeout: 5m
    interval: 10m
    config:
      name: linuxspeedtest
      apis:
        - name: pyspeedtest
          commands:
            - run: sudo python3 /etc/newrelic-infra/integrations.d/NR_checkspeed.py
              split: horizontal
              split_by: \s+
              set_header: [latency,download,upload]
              timeout: 300000
